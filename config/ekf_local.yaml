ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2

    two_d_mode: true

    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    transform_time_offset: 0.0
    transform_timeout: 0.0

    print_diagnostics: true
    debug: false

    # -------------------------
    # ODOM MOTEUR
    # -------------------------
    odom0: /odom

    # Ordre:
    # x, y, z,
    # roll, pitch, yaw,
    # vx, vy, vz,
    # vroll, vpitch, vyaw,
    # ax, ay, az
    #
    # Pour commencer, on utilise surtout les vitesses de l'odom moteur:
    # vx et vyaw.
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # -------------------------
    # IMU
    # -------------------------
    imu0: /imu/raw

    # Pour commencer, on utilise surtout la vitesse angulaire z de l'IMU.
    # Donc yaw rate.
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
